<!doctype html>
<meta charset="utf-8">
<title>Medic Tradeboard — store shot</title>
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 800px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #eef1f4; }
  .hero { position: absolute; left: 0; top: 0; width: 940px; height: 800px;
    display: flex; flex-direction: column; justify-content: center; padding: 0 80px; box-sizing: border-box; }
  .kicker { color: #2E9E5B; font-size: 15px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; margin: 0 0 18px; }
  h1 { color: #16191d; font-size: 46px; line-height: 1.12; font-weight: 600; margin: 0 0 22px; letter-spacing: -0.01em; }
  p { color: #5b6472; font-size: 20px; line-height: 1.55; margin: 0; max-width: 640px; }
  .marks { display: flex; gap: 26px; margin-top: 40px; }
  .mark { display: flex; align-items: center; gap: 10px; color: #16191d; font-size: 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
</style>
<div class="hero">
  <p class="kicker">Medic Tradeboard</p>
  <h1>See which open shifts<br>you're actually free to take.</h1>
  <p>Every posted shift on your WhenToWork tradeboard, scored against your own
     read-only calendars — ranked, with conflicts filtered out.</p>
  <div class="marks">
    <span class="mark"><span class="dot" style="background:#2E9E5B"></span>Read-only, no sign-in</span>
    <span class="mark"><span class="dot" style="background:#F5A623"></span>Ranked by real hours</span>
    <span class="mark"><span class="dot" style="background:#1F6FB2"></span>Nothing auto-sent</span>
  </div>
</div>

<script>
  window.chrome = { runtime: { getURL: (p) => new URL("/" + p, location.href).href } };
</script>
